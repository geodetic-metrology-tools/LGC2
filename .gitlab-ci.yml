include:
  - project: 'apc/common/gitlab-ci-utils'
    file: 'ci/scripts/gitlab-ci-susoft.yml'

##################
# PRE-COMMIT     #
##################

# Run pre-commit hooks to enforce code quality
# - Blocking for merge requests to master/appwidevs
# - Warning only for regular branch commits
pre-commit:
    stage: .pre
    image: python:3.11-slim
    before_script:
        - apt-get update && apt-get install -y git clang-format
        - pip install pre-commit "reuse[charset-normalizer]"
    script:
        # Only check files that changed in this branch
        - |
          if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
            # For merge requests, check files changed compared to target branch
            echo "Checking files changed in merge request..."
            git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
            FILES=$(git diff --name-only --diff-filter=d origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD)
          else
            # For regular branch pushes, check files changed in last commit
            echo "Checking files changed in last commit..."
            FILES=$(git diff --name-only --diff-filter=d HEAD~1)
          fi

          if [ -z "$FILES" ]; then
            echo "No files to check"
            exit 0
          fi

          echo "Files to check:"
          echo "$FILES"

          # Run pre-commit on changed files
          pre-commit run --files $FILES
    rules:
        # Never run on direct commits to protected branches
        - if: '$CI_COMMIT_BRANCH == "master"'
          when: never
        - if: '$CI_COMMIT_BRANCH == "appwidevs"'
          when: never
        # Blocking for merge requests to master/appwidevs
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "appwidevs")'
          when: on_success
          allow_failure: false
        # Warning only for other merge requests
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: on_success
          allow_failure: true
        # Warning only for regular branch pushes
        - if: '$CI_COMMIT_BRANCH'
          when: on_success
          allow_failure: true

# Check for Signed-off-by in all commits (only on merge requests)
# - Blocking for merge requests to master/appwidevs
# - Warning only for other merge requests
check-signoff:
    stage: .pre
    image: alpine/git:latest
    script:
        - |
          echo "Checking all commits for Signed-off-by line..."
          # Get the target branch for the merge request
          BASE_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
          # Check each commit in this merge request
          UNSIGNED_COMMITS=$(git log origin/${BASE_BRANCH}..HEAD --grep "^Signed-off-by:" --invert-grep --pretty=format:"%h %s")
          if [ -n "$UNSIGNED_COMMITS" ]; then
            echo ""
            echo "The following commits are missing 'Signed-off-by' line:"
            echo ""
            echo "$UNSIGNED_COMMITS"
            echo ""
            echo "All commits must be signed-off before merging."
            echo "To fix this, amend each commit with: git commit --amend -s --no-edit"
            echo "Or rebase and sign all commits: git rebase -i origin/${BASE_BRANCH} -x 'git commit --amend -s --no-edit'"
            echo ""
            exit 1
          else
            echo "All commits are properly signed-off"
          fi
    rules:
        # Blocking for merge requests to master/appwidevs
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "appwidevs")'
          when: on_success
          allow_failure: false
        # Warning only for other merge requests
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: on_success
          allow_failure: true

##################
# LINUX BUILDS   #
##################

# Build all targets and run the tests
linux_build_and_test:
    extends: .linux_build_and_test
    artifacts:
        expire_in: 1 day
        paths:
            - build/pyLGC/libpyLGC_C.so
            - source/pyLGC/tests/requirements.txt
            - build/LGC_API/libLGC_API.so

# Build and upload the LGC application
linux_release:
    extends: .linux_release
    needs: ["linux_build_and_test"]
    script:
        - !reference [.default_linux_before_scripts, script]
        - echo "Building executable | -j$(nproc)"
        - $CMAKEBIN --build . -j $(nproc) --config Release --target LGC
        - cp LGC ..
    artifacts:
        paths:
            - LGC

# Build and upload the Python bindings shared library
linux_pyLGC_release:
    stage: release
    image: gitlab-registry.cern.ch/apc/common/docker-image-susoft-cpp:alma9-base-qt6
    rules:
        - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9a-zA-Z._+-]+$/'
    dependencies: ["linux_build_and_test"]
    needs: ["linux_build_and_test"]
    script:
        - cp build/pyLGC/libpyLGC_C.so libpyLGC_C.so
        - cp source/pyLGC/pyLGC.py pyLGC.py
        - cp source/pyLGC/tests/requirements.txt requirements.txt
        - cp source/pyLGC/pyLGC_C.h pyLGC_C.h
    artifacts:
        paths:
            - libpyLGC_C.so
            - pyLGC.py
            - requirements.txt
            - pyLGC_C.h

##################
# WINDOWS BUILDS #
##################

# Build all targets and run the tests
windows64_build_and_test:
    extends: .windows64_build_and_test
    artifacts:
        expire_in: 1 day
        paths:
            - build/pyLGC/Release/pyLGC_C.dll
            - source/pyLGC/tests/requirements.txt
            - build/LGC_API/Release/LGC_API.dll
            - build/LGC_API/Release/LGC_API.lib

# Build and upload the LGC application
windows64_release:
    extends: .windows64_release
    needs: ["windows64_build_and_test"]
    script:
        - !reference [.default_windows_before_scripts, script]
        - echo "Building executable"
        - cmake --build . -j $env:NUMBER_OF_PROCESSORS --config Release --target PACKAGE
        - cp LGCInstaller-*.exe ..
    artifacts:
        paths:
            - LGCInstaller-*.exe

# Build and upload the Python bindings DLL
windows64_pyLGC_release:
    stage: release
    tags:
        - windows
        - x64
        - c++
    rules:
        - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9a-zA-Z._+-]+$/'
    dependencies: ["windows64_build_and_test"]
    needs: ["windows64_build_and_test"]
    script:
        - cp build/pyLGC/Release/pyLGC_C.dll pyLGC_C.dll
        - cp source/pyLGC/pyLGC.py pyLGC.py
        - cp source/pyLGC/tests/requirements.txt requirements.txt
        - cp source/pyLGC/pyLGC_C.h pyLGC_C.h
    artifacts:
        paths:
            - pyLGC_C.dll
            - pyLGC.py
            - requirements.txt
            - pyLGC_C.h

##################
# MONITORING BUNDLES (Python + C++) #
##################
# Self-contained "plug and play" bundles of the monitoring library, built on
# every branch push. Download the latest build of a branch via the permanent
# latest-artifacts permalink (no tag / release needed):
#   <project>/-/jobs/artifacts/<branch>/download?job=linux_monitoring_library
#   <project>/-/jobs/artifacts/<branch>/download?job=windows64_monitoring_library
# Each bundle serves BOTH the Python ctypes wrapper and direct C/C++ linking
# (the DLL exports only the moni* C ABI; the C++ Monitor is a header-only facade over it).

linux_monitoring_library:
    stage: release
    image: gitlab-registry.cern.ch/apc/common/docker-image-susoft-cpp:alma9-base-qt6
    rules:
        - if: '$CI_COMMIT_BRANCH'
    dependencies: ["linux_build_and_test"]
    needs: ["linux_build_and_test"]
    script:
        - mkdir -p monitoring_library
        - cp build/LGC_API/libLGC_API.so            monitoring_library/
        - cp source/LGC_API/python/pyMonitoring.py  monitoring_library/
        - cp source/LGC_API/python/tests/requirements.txt monitoring_library/
        - cp source/LGC_API/headers/Monitor.h    monitoring_library/
        - cp source/LGC_API/headers/Monitor_C.h monitoring_library/
        - cp source/LGC_API/BUNDLE_README.md        monitoring_library/README.md
    artifacts:
        name: "monitoring_library-linux-x86_64"
        expire_in: never
        paths:
            - monitoring_library/

windows64_monitoring_library:
    stage: release
    tags:
        - windows
        - x64
        - c++
    rules:
        - if: '$CI_COMMIT_BRANCH'
    dependencies: ["windows64_build_and_test"]
    needs: ["windows64_build_and_test"]
    script:
        - mkdir monitoring_library
        - cp build/LGC_API/Release/LGC_API.dll       monitoring_library/
        - cp build/LGC_API/Release/LGC_API.lib       monitoring_library/
        - cp source/LGC_API/python/pyMonitoring.py   monitoring_library/
        - cp source/LGC_API/python/tests/requirements.txt monitoring_library/
        - cp source/LGC_API/headers/Monitor.h     monitoring_library/
        - cp source/LGC_API/headers/Monitor_C.h monitoring_library/
        - cp source/LGC_API/BUNDLE_README.md         monitoring_library/README.md
    artifacts:
        name: "monitoring_library-windows-x64"
        expire_in: never
        paths:
            - monitoring_library/
