include:
  - project: 'apc/common/gitlab-ci-utils'
    file: 'ci/scripts/gitlab-ci-susoft.yml'

# Override stages from gitlab-ci-susoft.yml to insert SBOM generation
# after the build/test stage and before release packaging.
stages:
  - test
  - sbom
  - release

# Pinned Syft version for reproducible SBOM generation (local scripts use the same tag).
variables:
  SYFT_VERSION: "v1.27.1"

##################
# PRE-COMMIT     #
##################

# Run pre-commit hooks to enforce code quality
# - Blocking for merge requests to master/appwidevs
# - Warning only for regular branch commits
pre-commit:
    stage: .pre
    image: python:3.11-slim
    before_script:
        - apt-get update && apt-get install -y git
        - pip install pre-commit "reuse[charset-normalizer]"
    script:
        # Only check files that changed in this branch
        - |
          if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
            # For merge requests, check files changed compared to target branch
            echo "Checking files changed in merge request..."
            git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
            FILES=$(git diff --name-only --diff-filter=d origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD)
          else
            # For regular branch pushes, check files changed in last commit
            echo "Checking files changed in last commit..."
            FILES=$(git diff --name-only --diff-filter=d HEAD~1)
          fi

          if [ -z "$FILES" ]; then
            echo "No files to check"
            exit 0
          fi

          echo "Files to check:"
          echo "$FILES"

          # Run pre-commit on changed files
          pre-commit run --files $FILES
    rules:
        # Never run on direct commits to protected branches
        - if: '$CI_COMMIT_BRANCH == "master"'
          when: never
        - if: '$CI_COMMIT_BRANCH == "appwidevs"'
          when: never
        # Blocking for merge requests to master/appwidevs
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "appwidevs")'
          when: on_success
          allow_failure: false
        # Warning only for other merge requests
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: on_success
          allow_failure: true
        # Warning only for regular branch pushes
        - if: '$CI_COMMIT_BRANCH'
          when: on_success
          allow_failure: true

# Check for Signed-off-by in all commits (only on merge requests)
# - Blocking for merge requests to master/appwidevs
# - Warning only for other merge requests
check-signoff:
    stage: .pre
    image: alpine/git:latest
    script:
        - |
          echo "Checking all commits for Signed-off-by line..."
          # Get the target branch for the merge request
          BASE_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
          # Check each commit in this merge request
          UNSIGNED_COMMITS=$(git log origin/${BASE_BRANCH}..HEAD --grep "^Signed-off-by:" --invert-grep --pretty=format:"%h %s")
          if [ -n "$UNSIGNED_COMMITS" ]; then
            echo ""
            echo "The following commits are missing 'Signed-off-by' line:"
            echo ""
            echo "$UNSIGNED_COMMITS"
            echo ""
            echo "All commits must be signed-off before merging."
            echo "To fix this, amend each commit with: git commit --amend -s --no-edit"
            echo "Or rebase and sign all commits: git rebase -i origin/${BASE_BRANCH} -x 'git commit --amend -s --no-edit'"
            echo ""
            exit 1
          else
            echo "All commits are properly signed-off"
          fi
    rules:
        # Blocking for merge requests to master/appwidevs
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "appwidevs")'
          when: on_success
          allow_failure: false
        # Warning only for other merge requests
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: on_success
          allow_failure: true

##################
# LINUX BUILDS   #
##################

# Build all targets and run the tests
linux_build_and_test:
    extends: .linux_build_and_test
    artifacts:
        expire_in: 1 day
        paths:
            - build/LGC
            - build/pyLGC/libpyLGC_C.so
            - build/_deps/
            - build/CMakeCache.txt
            - source/pyLGC/tests/requirements.txt

##################
# SBOM           #
##################

# Install Syft from GitHub releases into the job workspace.
# CERN k8s runners only allow certain registries (not Docker Hub), and the
# official anchore/syft image is distroless (no shell) so GitLab cannot use it
# as the job image.
.syft_install:
    before_script:
        - |
          set -euo pipefail
          # Install outside the project tree so a source scan of "." cannot
          # pick up Syft's own embedded Go modules as LGC dependencies.
          SYFT_BIN_DIR="${SYFT_BIN_DIR:-/tmp/syft-bin}"
          mkdir -p "${SYFT_BIN_DIR}"
          SYFT_VER="${SYFT_VERSION#v}"
          echo "Installing Syft ${SYFT_VERSION} into ${SYFT_BIN_DIR}"
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_linux_amd64.tar.gz" \
            | tar -xz -C "${SYFT_BIN_DIR}" syft
          export PATH="${SYFT_BIN_DIR}:${PATH}"
          syft version

# Syft scan after Linux build, then augment from dependency.csv
# (versions, licenses, PURLs, parent graph) into one CycloneDX report.
linux_sbom:
    stage: sbom
    image: gitlab-registry.cern.ch/apc/common/docker-image-susoft-cpp:alma9-base-qt6
    extends: .syft_install
    needs:
        - job: linux_build_and_test
          artifacts: true
    script:
        - mkdir -p sbom
        - |
          export PATH="${SYFT_BIN_DIR:-/tmp/syft-bin}:${PATH}"
          SOURCE_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
          echo "Generating SBOM with Syft ${SYFT_VERSION} (version=${SOURCE_VERSION})"

          echo "Build artifact inventory:"
          ls -la build/LGC build/pyLGC/libpyLGC_C.so build/_deps 2>/dev/null || true
          file build/LGC build/pyLGC/libpyLGC_C.so 2>/dev/null || true

          syft dir:build \
            --source-name LGC2 \
            --source-version "${SOURCE_VERSION}" \
            -o cyclonedx-json=sbom/lgc-linux-build.cdx.json \
            -o spdx-json=sbom/lgc-linux-build.spdx.json

          if [ -f build/LGC ]; then
            syft file:build/LGC \
              --source-name LGC \
              --source-version "${SOURCE_VERSION}" \
              -o cyclonedx-json=sbom/lgc-linux-elf.cdx.json \
              -o spdx-json=sbom/lgc-linux-elf.spdx.json
          fi

          python3 scripts/generate-declared-sbom.py ci \
            --deps-file dependency.csv \
            --out-dir sbom \
            --syft sbom/lgc-linux-build.cdx.json \
            --output sbom/lgc-linux-augmented.cdx.json \
            --version "${SOURCE_VERSION}"

          echo "SBOM files:"
          ls -la sbom/
    artifacts:
        name: "sbom-linux-$CI_COMMIT_SHORT_SHA"
        # Keep indefinitely: SBOMs are small and useful for release provenance.
        expire_in: never
        paths:
            - sbom/
        reports:
            cyclonedx:
                - sbom/lgc-linux-augmented.cdx.json

# Syft scan of Windows build outputs, then same dependency.csv augmentation.
windows_sbom:
    stage: sbom
    image: gitlab-registry.cern.ch/apc/common/docker-image-susoft-cpp:alma9-base-qt6
    extends: .syft_install
    needs:
        - job: windows64_build_and_test
          artifacts: true
    script:
        - mkdir -p sbom
        - |
          export PATH="${SYFT_BIN_DIR:-/tmp/syft-bin}:${PATH}"
          SOURCE_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
          echo "Generating Windows SBOM with Syft ${SYFT_VERSION} (version=${SOURCE_VERSION})"

          echo "Windows artifact inventory:"
          ls -la build/Release/LGC.exe build/pyLGC/Release/pyLGC_C.dll 2>/dev/null || true

          syft dir:build \
            --source-name LGC2 \
            --source-version "${SOURCE_VERSION}" \
            -o cyclonedx-json=sbom/lgc-windows-build.cdx.json \
            -o spdx-json=sbom/lgc-windows-build.spdx.json

          python3 scripts/generate-declared-sbom.py ci \
            --deps-file dependency.csv \
            --out-dir sbom \
            --syft sbom/lgc-windows-build.cdx.json \
            --output sbom/lgc-windows-augmented.cdx.json \
            --version "${SOURCE_VERSION}"

          echo "SBOM files:"
          ls -la sbom/
    artifacts:
        name: "sbom-windows-$CI_COMMIT_SHORT_SHA"
        expire_in: never
        paths:
            - sbom/
        reports:
            cyclonedx:
                - sbom/lgc-windows-augmented.cdx.json

# Build and upload the LGC application
linux_release:
    extends: .linux_release
    needs: ["linux_build_and_test"]
    script:
        - !reference [.default_linux_before_scripts, script]
        - echo "Building executable | -j$(nproc)"
        - $CMAKEBIN --build . -j $(nproc) --config Release --target LGC
        - cp LGC ..
    artifacts:
        paths:
            - LGC

# Build and upload the Python bindings shared library
linux_pyLGC_release:
    stage: release
    image: gitlab-registry.cern.ch/apc/common/docker-image-susoft-cpp:alma9-base-qt6
    rules:
        - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9a-zA-Z._+-]+$/'
    dependencies: ["linux_build_and_test"]
    needs: ["linux_build_and_test"]
    script:
        - cp build/pyLGC/libpyLGC_C.so libpyLGC_C.so
        - cp source/pyLGC/pyLGC.py pyLGC.py
        - cp source/pyLGC/tests/requirements.txt requirements.txt
        - cp source/pyLGC/pyLGC_C.h pyLGC_C.h
    artifacts:
        paths:
            - libpyLGC_C.so
            - pyLGC.py
            - requirements.txt
            - pyLGC_C.h

##################
# WINDOWS BUILDS #
##################

# Build all targets and run the tests
windows64_build_and_test:
    extends: .windows64_build_and_test
    artifacts:
        expire_in: 1 day
        paths:
            - build/Release/LGC.exe
            - build/pyLGC/Release/pyLGC_C.dll
            - build/_deps/
            - build/CMakeCache.txt
            - source/pyLGC/tests/requirements.txt

# Build and upload the LGC application
windows64_release:
    extends: .windows64_release
    needs: ["windows64_build_and_test"]
    script:
        - !reference [.default_windows_before_scripts, script]
        - echo "Building executable"
        - cmake --build . -j $env:NUMBER_OF_PROCESSORS --config Release --target PACKAGE
        - cp LGCInstaller-*.exe ..
    artifacts:
        paths:
            - LGCInstaller-*.exe

# Build and upload the Python bindings DLL
windows64_pyLGC_release:
    stage: release
    tags:
        - windows
        - x64
        - c++
    rules:
        - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9a-zA-Z._+-]+$/'
    dependencies: ["windows64_build_and_test"]
    needs: ["windows64_build_and_test"]
    script:
        - cp build/pyLGC/Release/pyLGC_C.dll pyLGC_C.dll
        - cp source/pyLGC/pyLGC.py pyLGC.py
        - cp source/pyLGC/tests/requirements.txt requirements.txt
        - cp source/pyLGC/pyLGC_C.h pyLGC_C.h
    artifacts:
        paths:
            - pyLGC_C.dll
            - pyLGC.py
            - requirements.txt
            - pyLGC_C.h
