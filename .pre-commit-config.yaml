# Pre-commit hooks for LGC2
# See https://pre-commit.com for more information
#
# Hook sources (three categories):
#   1. Upstream open-source hooksets (pin each repo directly)
#   2. Shared APC hooks from apc/common/pre-commit-utils
#   3. LGC2-specific hooks (project policy / local tooling)
#
# Catalogue of recommended upstream hooks:
#   https://gitlab.cern.ch/apc/common/pre-commit-utils/-/blob/master/docs/catalogue.md

default_language_version:
  python: python3

repos:
  # ---------------------------------------------------------------------------
  # 1. Upstream hooksets
  # ---------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags used in GitLab CI
      - id: check-json
      - id: end-of-file-fixer
        exclude: '\.txt$'  # Exclude LGC test output files
      - id: trailing-whitespace
        exclude: '\.txt$'  # Exclude LGC test output files
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # 2. Shared APC hooks — apc/common/pre-commit-utils
  #    Pin to a release tag when available; commit SHA until then.
  # ---------------------------------------------------------------------------

  - repo: https://gitlab.cern.ch/apc/common/pre-commit-utils
    rev: 2a2897b3d7f1eac7d0c187fb289dee9d09b568bf
    hooks:
      - id: check-utf8-encoding
        exclude: 'test_files/.*\.txt$'
      - id: reuse-committed-files
      - id: check-todos
      - id: prevent-direct-branch-commit
        args: [--branch, master, --branch, appwidevs]
      - id: check-signoff

  # ---------------------------------------------------------------------------
  # 3. LGC2-specific hooks
  #    Project formatting follows LGC's .clang-format (-style=file), not a
  #    default upstream style. The mirror pin keeps the binary version fixed
  #    across machines/CI. Add other project-only checks as repo: local.
  # ---------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ["-style=file"]

  # - repo: local
  #   hooks:
  #     - id: example-lgc2-only-check
  #       name: Example LGC2-only check
  #       entry: bash -c 'echo "replace with a real LGC2-only check"; exit 0'
  #       language: system
  #       pass_filenames: false

# Configuration
fail_fast: false  # Run all hooks even if one fails
